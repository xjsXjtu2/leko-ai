# leko 配置 —— 唯一事实源（07-软件架构设计 §3.1；引脚照抄 05-接线与调试手册）
# 路径全部锚定 ~（树莓派用户主目录），与部署位置 ~/leko 解耦。

# 相对路径 = 仓库根（如 ~/leko-ai/）；所有数据内聚进仓库、gitignore 不进 git，
# 换克隆位置零改动。bash code/download_models.sh 一键重建模型。
paths:
  asr_dir: models/asr/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  kws_dir: models/asr/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
  vad_model: models/asr/silero_vad.onnx
  tts_voice: models/tts/zh_CN-huayan-medium.onnx
  prompt_dir: av_out/voice            # 播报词段 + 整句（offline 兜底用）
  tts_cache: av_out/cache             # edge-tts/piper 按文本缓存
  calib_file: voice_calib.json       # 编码器步/米校准（设备相关，gitignore）

pins:                                 # 实车已校准：forward() = 车头（前驱驱动轮端）前进
  motor_left:  {in1: 23, in2: 24, pwm: 12, invert: false}   # PWM12 = 硬件 PWM0
  motor_right: {in1: 17, in2: 27, pwm: 13, invert: true}     # 2026-10-04 右轮与定义相反，代码翻转；PWM13 = 硬件 PWM1
                                        # ReSpeaker 到货后 in1: 17 → 26（06 手册已定）
  encoder_left:  {a: 5,  b: 6}
  encoder_right: {a: 25, b: 16}

wake:                                 # 唤醒词（sherpa-onnx KeywordSpotter）
  words:                               # [显示文本, 拼音(带声调数字)]
    - ["乐可", "le4 ke3"]                 # 乐=四声 lè，可=三声 kě（品牌 leko 的中文读法）
    - ["乐可乐可", "le4 ke3 le4 ke3"]
  threshold: 0.25                     # 越大越难触发；喊不应就调小
  continue_window_s: 12               # 免唤醒续听窗口；行驶中不回睡眠（"停"要能打断）
  preroll_s: 0.30                     # 预缓冲：VAD 触发前 0.3s 拼回段首，补削掉的首字

motion:
  speed_pwm: 0.35                     # 行驶 PWM（≈0.25m/s，无雷达限速）
  max_dist_m: 3.0                     # 单条指令最大距离
  max_reverse_m: 1.0                  # 前驱：禁长倒
  wheel_base_m: 0.17                  # 两驱动轮中心距（calib 实测替换）
  straight_k: 4.0                     # 直线修正增益：右轮 PWM = speed + K×(左米-右米)
  turn_sign: 1                        # 实车"左转"若向右转，改 -1（不改接线）
  tick_s: 0.02                        # 50Hz 控制周期

safety:
  stall_ms: 500                       # PWM 有输出且编码器无脉冲 → 断电（520 堵转 3.5A > TB6612 峰值 3.2A）
  junk_dbfs: -45.0                    # 语音段电平低于此 = 呼吸/远场杂音，不送识别

tts:
  edge_voice: "zh-CN-XiaoxiaoNeural"  # 中文音色（微软晓晓）：流程指令；断网自动切 piper
  edge_voice_en: "en-US-AnaNeural"   # 英文音色（Ana 儿童声）：念单词/拼字母（听写）

dictation:                            # F2.0 英语听写（08-技术方案）
  ecs_base: "http://8.161.228.205:8300"   # ECS 视觉服务（root@，免密已配）
  device_token: ""                    # 留空则读仓库根 device_token 文件（gitignore）
  photo_blur_min: 30.0                # 拍照清晰度阈值：先按低纹理室内场景放低（白墙~19），
                                      # 真实单词表照片标定后改（文字边缘方差高得多）
  word_gap_s: 10.0                   # 词间等待（写字时间）；"下一个"可跳过
  rounds_max: 3                      # 订正循环上限（需求 F2.0）
  repeats: 3                         # 每词念几遍（已拍板：统一 3 遍）
  gap_per_letter: 0.5                # 每遍间隔 = 字母数 × 此值（已拍板：÷2 秒）
